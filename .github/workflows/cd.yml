# Release workflow.
#
# Triggers: push to `master` (excluding version tags) and manual dispatch.
# Publishes the package to npm and creates the GitHub release via
# semantic-release.
#
# Auth: npm publishing uses OIDC "trusted publishing" (no NPM_TOKEN secret).
# A trusted publisher for this repo + workflow must be configured on
# npmjs.com. The GITHUB_TOKEN is auto-provided; its scopes are pinned below.
name: Release

on:
  push:
    branches:
      - master
    tags-ignore:
      - '*.*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    # Least-privilege scopes for the release job:
    #   contents: write        -> semantic-release/git pushes the release
    #                             commit + tag; semantic-release/github
    #                             creates the GitHub release
    #   issues / pull-requests -> semantic-release/github release comments
    #   id-token: write        -> OIDC exchange for npm trusted publishing
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      # Corepack resolves the Yarn version pinned in package.json's
      # "packageManager" field. Enable it after setup-node so the yarn
      # shim binds to the active Node.
      - name: Enable Corepack
        run: corepack enable
      - name: Get node version
        id: node
        run: echo "::set-output name=version::$(node -v)"
      - name: Get node_modules cache
        uses: actions/cache@v5
        id: node_modules
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/yarn.lock') }}-${{ steps.node.outputs.version }}
      - name: Install dependencies
        run: yarn install --immutable
      - name: Create build
        run: yarn build
      # npm auth is handled at publish time via OIDC (see id-token permission
      # above) — no NPM_TOKEN and no ~/.npmrc auth line needed.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn release
